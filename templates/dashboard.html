<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dhyeya AI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f1a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* --- TOP NAVIGATION & PROFILE BAR --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn, .profile-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            background: #16192b;
            border: 1px solid #2a2f4c;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .profile-btn {
            color: #ffffff;
            background: rgba(99, 91, 255, 0.15);
            border-color: rgba(99, 91, 255, 0.4);
        }

        .back-btn:hover {
            color: #ffffff;
            background: #1e2238;
            border-color: #635bff;
            transform: translateX(-3px);
        }

        .profile-btn:hover {
            background: #635bff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 91, 255, 0.3);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: #635bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header h1 span {
            color: #635bff;
        }

        .header p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 1rem;
        }

        .summary-card {
            background: #16192b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .summary-card h2 {
            font-size: 1.4rem;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: #1e2238;
            border: 1px solid #2a2f4c;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(99, 91, 255, 0.15);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
        }

        .stat-info .label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stat-info .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 4px;
        }

        .recent-section {
            background: #16192b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .recent-section h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .upload-list {
            list-style: none;
        }

        .upload-item {
            background: #1e2238;
            border: 1px solid #2a2f4c;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upload-item:last-child {
            margin-bottom: 0;
        }

        .upload-title {
            font-weight: 600;
        }

        .upload-meta {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .empty-state {
            color: #64748b;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Top Navigation with Back Button & Profile Option -->
        <div class="top-nav">
            <a href="/" class="back-btn">
                <span>←</span> Back to Home
            </a>
            <div class="nav-actions">
                <a href="/profile" class="profile-btn">
                    <div class="user-avatar" id="avatar-initial">U</div>
                    <span>My Profile</span>
                </a>
            </div>
        </div>

        <div class="header">
            <h1>Welcome Back, <span id="user-display-name">Student</span>! 👋</h1>
            <p>Track your learning progress, recent uploads, and quick actions here.</p>
        </div>

        <div class="summary-card">
            <h2>Progress Summary</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-icon">📄</div>
                    <div class="stat-info">
                        <div class="label">Uploads</div>
                        <div class="value" id="uploads-count">0</div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">❓</div>
                    <div class="stat-info">
                        <div class="label">Questions</div>
                        <div class="value" id="questions-count">0</div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">🏷️</div>
                    <div class="stat-info">
                        <div class="label">Bookmarks</div>
                        <div class="value" id="bookmarks-count">0</div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-icon">📝</div>
                    <div class="stat-info">
                        <div class="label">Notes</div>
                        <div class="value" id="notes-count">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="recent-section">
            <h2>Recent Uploads</h2>
            <div id="recent-uploads-container">
                <div class="empty-state">No uploads found. Start by uploading a document!</div>
            </div>
        </div>
    </div>

    <script src="/static/js/config.js"></script>
    <script>
        async function fetchDashboardData() {
            const token = localStorage.getItem("dhyeya_token") || localStorage.getItem("access_token") || localStorage.getItem("token");

            if (!token) {
                window.location.href = "/login";
                return;
            }

            const headers = {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            };

            try {
                // User info & Avatar setup
                try {
                    const userRes = await fetch("/api/auth/me", { headers });
                    if (userRes.ok) {
                        const userData = await userRes.json();
                        const name = userData.full_name || userData.username || "Student";
                        document.getElementById("user-display-name").innerText = name;
                        document.getElementById("avatar-initial").innerText = name.charAt(0).toUpperCase();
                    }
                } catch(e) {}

                // Summary fetch
                let summaryRes = await fetch("/api/dashboard/summary", { headers });
                
                if (!summaryRes.ok && summaryRes.status === 404) {
                    summaryRes = await fetch("/summary", { headers });
                }

                if (summaryRes.ok) {
                    const data = await summaryRes.json();

                    document.getElementById("uploads-count").innerText = data.uploads_count ?? 0;
                    document.getElementById("questions-count").innerText = data.questions_count ?? 0;
                    document.getElementById("bookmarks-count").innerText = data.bookmarks_count ?? 0;
                    document.getElementById("notes-count").innerText = data.notes_count ?? 0;

                    const recentContainer = document.getElementById("recent-uploads-container");
                    if (data.recent_uploads && data.recent_uploads.length > 0) {
                        recentContainer.innerHTML = '<ul class="upload-list">' + 
                            data.recent_uploads.map(item => `
                                <li class="upload-item">
                                    <div>
                                        <div class="upload-title">${item.filename}</div>
                                        <div class="upload-meta">${item.exam || 'General'} • ${item.subject || 'General'}</div>
                                    </div>
                                    <div class="upload-meta">${new Date(item.created_at).toLocaleDateString()}</div>
                                </li>
                            `).join('') + 
                        '</ul>';
                    } else {
                        recentContainer.innerHTML = '<div class="empty-state">No uploads found. Start by uploading a document!</div>';
                    }

                } else if (summaryRes.status === 401) {
                    localStorage.removeItem("dhyeya_token");
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("token");
                    window.location.href = "/login";
                }
            } catch (error) {
                console.error("Dashboard data error:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", fetchDashboardData);
    </script>
</body>
</html>
